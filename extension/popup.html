<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>诚信核查插件工具包</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      color: #222;
    }

    body.capture-hidden {
      width: 1px;
      height: 1px;
      min-width: 1px;
      min-height: 1px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      background: transparent;
    }

    body.capture-hidden > * {
      display: none;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
    }

    .section {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
    }

    .section-title {
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
    }

    input,
    textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    input {
      height: 32px;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.5;
      font-family: Consolas, "Microsoft YaHei", monospace;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    .site-card {
      padding: 10px;
      border-radius: 6px;
      background: #f3f4f6;
      line-height: 1.5;
    }

    .site-name {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    .site-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #6b7280;
      word-break: break-all;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .site-list-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .site-list-source {
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
    }

    button {
      min-height: 34px;
      padding: 7px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #f3f4f6;
    }

    button.primary {
      border-color: #2563eb;
      background: #2563eb;
      color: #ffffff;
    }

    button.primary:hover {
      background: #1d4ed8;
    }

    button.danger {
      border-color: #ef4444;
      color: #b91c1c;
    }

    button.full {
      grid-column: 1 / 3;
    }

    #status {
      min-height: 20px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: #6b7280;
    }

    .footer {
      margin-top: 8px;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>诚信核查插件工具包</h1>

  <div class="section">
    <div class="section-title">项目信息</div>

    <label for="projectName">项目名称</label>
    <input
      id="projectName"
      type="text"
      placeholder="例如：XX公司债券诚信核查"
    />

    <label for="subjectName">核查主体名称</label>
    <input
      id="subjectName"
      type="text"
      placeholder="例如：青岛城投城金控股集团有限公司"
    />
  </div>

  <div class="section">
    <div class="section-title">当前核查网站</div>

    <div class="site-card">
      <div id="currentSiteName" class="site-name">尚未加载网站清单</div>
      <div id="currentSiteUrl" class="site-meta">请先配置 sites.json</div>
      <div id="progressText" class="site-meta">进度：0 / 0</div>
    </div>

    <div class="hint">
      在核查网站完成查询后，点击“保存当前截图”即可自动截图、标注并归档。
    </div>
  </div>

  <div class="section">
    <div class="section-title">网站清单</div>
    <div id="siteListSource" class="site-list-source">正在读取网站清单...</div>

    <label for="customSitesText">自定义网站列表</label>
    <textarea
      id="customSitesText"
      spellcheck="false"
      placeholder="每行一个网站：网站名称 | https://example.com"
    ></textarea>

    <div class="site-list-toolbar">
      <button id="saveCustomSitesBtn" class="primary">保存自定义清单</button>
      <button id="loadDefaultSitesBtn">填入默认清单</button>
      <button id="resetCustomSitesBtn" class="danger full">恢复默认清单</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">操作</div>

<div class="button-grid">
  <button id="openCurrentBtn" class="primary">打开当前网站</button>
  <button id="openPreviousBtn">上一个网站</button>

  <button id="copySubjectBtn">复制主体名称</button>
  <button id="openNextBtn">下一个网站</button>

  <button id="newProjectBtn" class="full">新建项目</button>

  <button id="captureBtn" class="primary full">保存当前截图</button>

  <button id="skipBtn">跳过当前网站</button>
  <button id="resetBtn" class="danger">重置进度</button>
</div>

    <div id="status"></div>
  </div>

  <div class="footer">
    v0.1.0 · Edge 插件仅用于网站打开、截图标注和图片归档
  </div>

  <script src="popup.js"></script>
</body>
</html>
